[package]
name = "as-export"
description = "AutoScene export: frame-exact clip rendering with self-verification, presets"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
as-core.workspace = true
as-media.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
thiserror.workspace = true
tracing.workspace = true
zip = { version = "4.6", default-features = false, features = ["deflate"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "rand_core"] }
rand_core = { version = "0.6", features = ["std"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
as-testkit.workspace = true
tempfile = "3.27"
