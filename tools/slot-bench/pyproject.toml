[project]
name = "autoscene-slot-bench"
version = "0.1.0"
description = "Dev-only: runs ready-made models for the scenes and expressions slots (bench/models, rows 5 and 6); never shipped."
requires-python = ">=3.14"
# Newest releases (pre-releases included), pinned exactly.
dependencies = [
    "torch==2.14.1",
    "numpy==2.5.4",
    "torchvision==0.29.2",
    "onnxruntime-directml==1.24.4",
    "safetensors==0.9.0rc1",
    "pillow==13.0.0",
]

[tool.uv]
package = false
prerelease = "allow"
