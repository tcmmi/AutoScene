[package]
name = "autoscene-app"
description = "AutoScene desktop app"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "autoscene-app"

[lib]
name = "autoscene_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "autoscene-app"
path = "src/main.rs"

# Dev tool that rewrites app/src/bindings.ts (`npm run bindings`). Behind a
# feature so the installers leave it out: `tauri build` bundles every bin of
# this crate except those whose required features are off.
[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"
required-features = ["export-bindings"]

[features]
export-bindings = []

[build-dependencies]
tauri-build.workspace = true

[dependencies]
as-core.workspace = true
as-api.workspace = true
# The catalog's row (plugins/catalog.rs).
as-db.workspace = true
as-engine.workspace = true
as-export.workspace = true
as-jobs.workspace = true
as-media.workspace = true
as-models.workspace = true
# WebAssembly plugins run in the app's sandbox (wasmtime).
as-plugin = { workspace = true, features = ["wasm"] }
as-project.workspace = true
base64.workspace = true
parking_lot.workspace = true
# Which catalog version is newer than the one installed (plugins/catalog.rs).
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-serde.workspace = true
specta-util.workspace = true
tokio.workspace = true
log = "0.4.34"
# Bridge `tracing` events from library crates into tauri-plugin-log.
tracing = { workspace = true, features = ["log"] }
tauri = { workspace = true, features = ["protocol-asset"] }
tauri-runtime-wry.workspace = true
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
tauri-plugin-log = "=3.0.0-alpha.2"
tauri-plugin-opener = "=3.0.0-alpha.2"
tauri-plugin-clipboard-manager = "=3.0.0-alpha.2"
tauri-plugin-dialog = "=3.0.0-alpha.3"
tauri-plugin-updater = "=3.0.0-alpha.2"
tauri-plugin-single-instance = "=3.0.0-alpha.2"
tauri-plugin-window-state = "=3.0.0-alpha.2"

[dev-dependencies]
# The WebAssembly plugin tests run the sandbox's test guest.
as-testkit.workspace = true
# The catalog's tests sign the indexes they serve.
minisign.workspace = true
# The catalog's tests make writing its row fail, with a trigger.
rusqlite.workspace = true
# The catalog's tests pack the packages it offers.
zip.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# A plugin page's saved file is marked as a download (plugins/calls.rs).
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# WebKitGTK's own menu, off in release builds (window.rs).
webkit2gtk.workspace = true

[target.'cfg(windows)'.dependencies]
# Keep the PC awake while analysis runs.
windows-sys = { workspace = true, features = [
    "Win32_System_Power",
    # The Windows build, for Mica (window.rs).
    "Wdk_System_SystemServices",
    "Win32_System_SystemInformation",
] }
# WebView2's browser keys and menu, off in release builds (window.rs).
webview2-com.workspace = true
windows-core.workspace = true
