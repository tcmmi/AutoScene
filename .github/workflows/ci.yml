name: CI

# main is the only branch: everything is built where it lands.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # What the desktop shell links against on Linux (WebKitGTK and friends).
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      # Installs the pinned nightly (plus rustfmt/clippy) from rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The exact, checksum-pinned ffmpeg the app ships with (Homebrew's lacks
      # zimg, which HDR tone mapping needs).
      - name: FFmpeg
        shell: bash
        run: |
          cargo xtask fetch-sidecars
          # Later steps run in pwsh on Windows: hand them a native path, not Git Bash's /d/a/….
          dir="$PWD/app/src-tauri/ffmpeg"
          if command -v cygpath >/dev/null; then dir="$(cygpath -w "$dir")"; fi
          echo "$dir" >> "$GITHUB_PATH"
          echo "AUTOSCENE_FFMPEG_DIR=$dir" >> "$GITHUB_ENV"
      - name: Frontend dist placeholder
        shell: bash
        run: mkdir -p app/dist
      - run: cargo fmt --all --check
      # The features bring in the export-bindings and asp dev tools, so they're
      # linted too.
      - run: cargo clippy --workspace --all-targets --features autoscene-app/export-bindings,as-plugin/cli -- -D warnings
      - name: Generate fixtures
        run: cargo xtask fixtures
      # The WebAssembly plugins the sandbox tests run (crates/as-plugin/tests/wasm.rs).
      - name: Build the test plugins
        run: cargo xtask wasm-guests
      # asp's tests run the tool, which builds only with its feature. One
      # failing crate doesn't hide what the others would say.
      - run: cargo test --workspace --features as-plugin/cli --no-fail-fast
        env:
          AUTOSCENE_REQUIRE_FIXTURES: "1"
      # Core ML (as-vision's tests/coreml.rs) needs SCRFD, ArcFace and CCIP,
      # kept between runs while the manifest stays the same. The run above
      # skips those tests without the models; here they must run.
      - name: Core ML test models
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/coreml-models
          key: coreml-models-${{ hashFiles('models/manifest.toml') }}
      - name: Core ML matches the processor and keeps its compiled models
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo xtask fetch-models --only scrfd-10g,arcface-glintr100,anime-ccip-b36 --dir "$AUTOSCENE_MODELS_DIR"
          cargo test -p as-vision --test coreml
        env:
          AUTOSCENE_MODELS_DIR: ${{ runner.temp }}/coreml-models
          AUTOSCENE_REQUIRE_MODELS: "1"
      # The app's bindings, and the plugin protocol's types the kit is built on.
      - name: Bindings are up to date
        shell: bash
        run: |
          cargo run -p autoscene-app --bin export-bindings --features export-bindings
          git diff --exit-code app/src/bindings.ts app/src/plugin-kit/protocol.ts
      # The English of every msg!, which the UI's backend catalog is made of.
      - name: The backend catalog is up to date
        shell: bash
        run: |
          cargo xtask i18n
          git diff --exit-code app/src/locales/en/backend.json

  # The two WebAssembly examples, built from their source as their READMEs
  # say, then checked, packed and run as AutoScene runs them. A component runs
  # the same on every system, so Linux is enough; the app isn't built.
  wasm-examples:
    name: WebAssembly examples
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      # The pinned nightly of rust-toolchain.toml, with the wasm32-wasip2 target.
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # setup-uv and uv as the plugin catalog pins them, exactly.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
      # Workspaces of their own, which the rust job's fmt and clippy don't see.
      - name: Lint the test guest and the Rust example
        run: |
          for manifest in crates/as-plugin/tests/guest/Cargo.toml examples/plugins/discord-notify-wasm/Cargo.toml; do
            cargo fmt --check --manifest-path "$manifest"
            cargo clippy --release --locked --target wasm32-wasip2 --manifest-path "$manifest" -- -D warnings
          done
      - name: Build the examples
        run: |
          cd examples/plugins/discord-notify-wasm
          cargo build --release --locked --target wasm32-wasip2
          cp target/wasm32-wasip2/release/discord_notify_wasm.wasm plugin/plugin.wasm
          cd ../clip-list-py
          uv tool run --from componentize-py==0.25.1 componentize-py -d wit -w plugin componentize app -o plugin/plugin.wasm
      - name: Check and pack them
        run: |
          for plugin in discord-notify-wasm clip-list-py; do
            cargo run -p as-plugin --features cli --bin asp -- check "examples/plugins/$plugin/plugin"
            cargo run -p as-plugin --features cli --bin asp -- pack "examples/plugins/$plugin/plugin" "$RUNNER_TEMP/$plugin.asp"
          done
      # The examples' own tests, and the examples' test of asp_cli.rs, which
      # packs and verifies the WebAssembly ones only when they are built.
      - name: Run them
        env:
          AUTOSCENE_WASM_EXAMPLES: ${{ github.workspace }}/examples/plugins
          AUTOSCENE_REQUIRE_WASM_EXAMPLES: "1"
        run: |
          cargo test -p as-plugin --features cli --test wasm_examples
          cargo test -p as-plugin --features cli --test asp_cli -- the_example_plugins_pack_and_parse

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Before the tests: one of them checks what the kit build wrote.
      - run: npm run build:kit
      - run: npm test -- --passWithNoTests
      - run: npm run build
      # The kit's declarations that `asp init` hands out are made by the build,
      # new files included.
      - name: Kit types are up to date
        run: |
          git diff --exit-code ../crates/as-plugin/templates/types
          test -z "$(git status --porcelain ../crates/as-plugin/templates/types)"
