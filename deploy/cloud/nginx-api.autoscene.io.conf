# api.autoscene.io: AutoScene Cloud's gateway for the app and the GPU worker,
# straight to this server (DNS only, not through Cloudflare): no 100 MB body
# or 100 s answer limit. Clients connect directly, so $remote_addr is theirs.
server {
    listen 80;
    listen [::]:80;
    server_name api.autoscene.io;
    location /.well-known/acme-challenge/ {
        root /var/www/autoscene.io;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.autoscene.io;
    ssl_certificate /etc/letsencrypt/live/api.autoscene.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.autoscene.io/privkey.pem;
    include snippets/autoscene-cloud.conf;
}
