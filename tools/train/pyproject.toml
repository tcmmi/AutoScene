[project]
name = "autoscene-train"
version = "0.1.0"
description = "Dev-only: trains AutoScene's own identity embedders (bench/models); never shipped."
requires-python = ">=3.14"
# Newest releases (pre-releases included), pinned exactly. torch and
# torchvision are the CUDA builds (the newest pair that exists for this
# Python on Windows); everything else comes from PyPI.
dependencies = [
    "torch==2.14.1+cu132",
    "torchvision==0.29.1+cu132",
    "timm==1.0.31",
    "numpy==2.5.4",
    "pillow==13.0.0",
    "safetensors==0.9.0rc1",
    "onnx==1.23.2",
    "onnxruntime-directml==1.24.4",
]

[tool.uv]
package = false
prerelease = "allow"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
