# The gateway's locations (sites-available/autoscene.io).

location /.well-known/acme-challenge/ {
    root /var/www/autoscene.io;
}

# The brand images Stripe shows (deploy/cloud/brand, copied to /var/www/autoscene.io/brand).
location /brand/ {
    root /var/www/autoscene.io;
    expires 30d;
}

location = /paid {
    default_type text/html;
    return 200 '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Payment received · AutoScene</title><body style="font-family:system-ui,sans-serif;background:#0b0b0d;color:#f2f2f2;display:grid;place-items:center;min-height:100vh;margin:0"><div style="text-align:center;max-width:28rem;padding:2rem"><h1 style="font-weight:600">Thanks, your payment went through</h1><p style="color:#a8a8b0">Your AutoScene Cloud balance updates in a moment. You can close this tab and go back to AutoScene.</p></div>';
}

location = /cancelled {
    default_type text/html;
    return 200 '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Payment cancelled · AutoScene</title><body style="font-family:system-ui,sans-serif;background:#0b0b0d;color:#f2f2f2;display:grid;place-items:center;min-height:100vh;margin:0"><div style="text-align:center;max-width:28rem;padding:2rem"><h1 style="font-weight:600">No payment was made</h1><p style="color:#a8a8b0">You can close this tab and go back to AutoScene.</p></div>';
}

location / {
    proxy_pass http://127.0.0.1:8740;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The gateway reads the last address: the client's (real IP above).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 100m;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}
