[package]
name = "as-plugin"
description = "AutoScene plugins: what a plugin declares and how AutoScene checks it"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true

# The tool plugin authors pack and sign with (`cargo install --path
# crates/as-plugin --features cli --bin asp`). Behind a feature, so the app
# doesn't build minisign's signing side and password prompt.
[[bin]]
name = "asp"
path = "src/bin/asp.rs"
required-features = ["cli"]

# A stand-in plugin for the runtime tests (tests/runtime.rs), never shipped.
[[bin]]
name = "asp_test_plugin"
path = "src/bin/asp_test_plugin.rs"
test = false
doc = false

[features]
# The WebAssembly tier: wasmtime, its sandbox and its network guard
# (src/wasm). The app turns it on; asp needs it to check components.
wasm = [
    "dep:wasmtime",
    "dep:wasmtime-wasi",
    "dep:wasmtime-wasi-http",
    "dep:wasmparser",
    "dep:tokio",
    "dep:http",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:webpki-roots",
    "dep:hyper",
    "dep:http-body-util",
]
cli = ["wasm", "dep:minisign", "dep:tempfile"]

[dependencies]
as-core.workspace = true
as-api.workspace = true
as-db.workspace = true
as-media.workspace = true
serde.workspace = true
# A call's params stay the text the plugin wrote until the call is answered.
serde_json = { workspace = true, features = ["raw_value"] }
specta.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
uuid.workspace = true
semver.workspace = true
sha2.workspace = true
zip.workspace = true
minisign-verify.workspace = true
base64.workspace = true
keyring.workspace = true
# A catalog package downloads as AutoScene's models do (src/fetch.rs words
# what fails).
as-models.workspace = true
# net.fetch (src/net.rs).
ureq.workspace = true
url.workspace = true
# AutoScene's uv: its pins (uv.toml, src/uv.rs). The tests read the example
# plugins' scripts and locks with it too (tests/asp_cli.rs).
toml.workspace = true
minisign = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
# WebAssembly plugins (feature `wasm`).
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
wasmtime-wasi-http = { workspace = true, optional = true }
wasmparser = { workspace = true, optional = true }
# The workspace's tokio has no `net`; the network guard connects itself.
tokio = { workspace = true, optional = true, features = ["net"] }
http = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }

# page-state.json is opened without following a link (O_NOFOLLOW).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
minisign.workspace = true
tempfile.workspace = true
# The store's tests make library.db refuse a write.
rusqlite.workspace = true
# The test guest (tests/wasm.rs, built by `cargo xtask wasm-guests`), and
# components written as text.
as-testkit.workspace = true
wat.workspace = true
# A local HTTPS server for the network guard's tests (tests/wasm_net.rs).
rcgen.workspace = true
hyper = { workspace = true, features = ["server"] }
# A uv archive, as its release packs it (src/uv.rs).
tar.workspace = true
flate2.workspace = true
