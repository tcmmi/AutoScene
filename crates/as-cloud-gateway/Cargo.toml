[package]
name = "as-cloud-gateway"
description = "AutoScene Cloud's gateway: accounts, balances, top-up codes, Stripe, uploads and scan sessions, on the owner's server"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "autoscene-cloud-gateway"
path = "src/main.rs"

[dependencies]
as-cloud.workspace = true
axum = "=0.8.9"
getrandom = "=0.4.3"
hmac = "=0.13.0"
parking_lot.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }
ureq.workspace = true
uuid.workspace = true

[dev-dependencies]
as-cloud = { workspace = true, features = ["client"] }
tempfile.workspace = true
