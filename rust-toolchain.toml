# Newest nightly, pinned by date so every machine and CI builds with the same
# compiler. Bump the date to move forward (`rustup toolchain install nightly`
# shows the newest).
[toolchain]
channel = "nightly-2026-10-13"
components = ["rustfmt", "clippy"]
# WebAssembly plugins: the test guest and the examples (`cargo xtask wasm-guests`).
targets = ["wasm32-wasip2"]
profile = "minimal"
