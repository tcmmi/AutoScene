# autoscene.io: AutoScene Cloud's gateway (/v1/..., /health) and the pages
# Stripe sends buyers to. Behind Cloudflare: the real client address comes
# from CF-Connecting-IP. A website can take the other paths later.

map $request_uri $autoscene_paid_page { default ""; }

server {
    listen 80;
    listen [::]:80;
    server_name autoscene.io;
    include snippets/cloudflare-real-ip.conf;
    include snippets/autoscene-cloud.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name autoscene.io;
    ssl_certificate /etc/letsencrypt/live/autoscene.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autoscene.io/privkey.pem;
    include snippets/cloudflare-real-ip.conf;
    include snippets/autoscene-cloud.conf;
}
