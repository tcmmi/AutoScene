[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri", "app/redteam", "xtask"]
default-members = ["crates/*", "app/src-tauri"]
# The test guest and the example plugins are workspaces of their own, built
# for wasm32-wasip2 (`cargo xtask wasm-guests`).
exclude = ["vendor", "crates/as-plugin/tests/guest", "examples"]

[workspace.package]
version = "1.0.4-BETA"
edition = "2024"
rust-version = "1.97"
license = "Proprietary"
repository = "https://github.com/tcmmi/AutoScene"
authors = ["tcmmi"]

[workspace.dependencies]
# internal
as-core = { path = "crates/as-core" }
as-api = { path = "crates/as-api" }
as-testkit = { path = "crates/as-testkit" }
as-media = { path = "crates/as-media" }
as-export = { path = "crates/as-export" }
as-db = { path = "crates/as-db" }
as-jobs = { path = "crates/as-jobs" }
as-project = { path = "crates/as-project" }
as-models = { path = "crates/as-models" }
as-infer = { path = "crates/as-infer" }
as-vision = { path = "crates/as-vision" }
as-analysis = { path = "crates/as-analysis" }
as-engine = { path = "crates/as-engine" }
as-identity = { path = "crates/as-identity" }
as-plugin = { path = "crates/as-plugin" }

# shared third-party
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28", features = ["v4", "v7", "serde"] }
tracing = "0.1.44"
parking_lot = "0.12.5"
zstd = "0.14.2"
half = "=2.7.1"
ort = { version = "=2.0.0-rc.15", default-features = false }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json", "uuid"] }
specta-serde = "=0.0.12"
specta-util = "=0.0.12"
dirs = "7.0"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
libc = "=0.2.191"
semver = "=1.0.28"
sha2 = "=0.11.1"
zip = { version = "=9.2.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
minisign-verify = "=0.3.0"
minisign = "=0.10.0"
base64 = "=0.23.1"
tempfile = "=3.27.0"
proc-macro2 = "=1.0.107"
syn = "=3.0.9"
toml = "=1.1.8"
libloading = "=0.9.0"
windows-sys = "=0.61.2"
windows = "=0.62.2"
ureq = "=3.5.1"
url = "=2.5.8"
flate2 = "=1.1.10"
tar = { version = "=0.4.46", default-features = false }
keyring = "=4.2.0"
# The languages the system lists, in the person's order (the app's locale.rs).
sys-locale = "=0.3.2"
# The desktop shell. The app and the red team (app/redteam) build on the
# same Tauri, so a bump moves both and the red team runs on it.
tauri = "=3.0.0-alpha.4"
tauri-build = "=3.0.0-alpha.3"
tauri-runtime-wry = "=3.0.0-alpha.4"
# WebView2's settings (the app's window.rs). The versions tauri-runtime-wry's
# wry uses, so its controller is the same type: move them with a wry bump.
webview2-com = "=0.39.1"
# WebKitGTK's own menu (the app's window.rs): the version wry uses.
webkit2gtk = "=2.0.2"
windows-core = "=0.62.2"
# The WebAssembly tier (as-plugin's `wasm` feature): components on WASI 0.2
# only (p3 is experimental in wasmtime 50), no wasmtime cache, and no
# wasi:http client of wasmtime's own: AutoScene sends each request itself.
wasmtime = { version = "=50.0.1", default-features = false, features = ["runtime", "cranelift", "component-model", "std", "parallel-compilation", "async"] }
wasmtime-wasi = { version = "=50.0.1", default-features = false, features = ["p2"] }
wasmtime-wasi-http = { version = "=50.0.1", default-features = false, features = ["p2"] }
# What a component imports, read for its review without compiling it. The
# version wasmtime 50.0.1 reads components with, not the newest: the two must
# agree on what a component says, and the app carries one copy.
wasmparser = { version = "=0.261.0", default-features = false, features = ["std", "component-model"] }
http = "=1.5.0"
# The network guard of WebAssembly plugins (as-plugin's src/wasm/net.rs):
# AutoScene's own TLS and HTTP/1.1 client, with Mozilla's roots.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "tls12", "logging", "std"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "=1.0.11"
hyper = { version = "=1.12.0", features = ["client", "http1"] }
http-body-util = "=0.1.5"
# tests only
wat = "=1.263.0"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }

[profile.dev]
# Media/vision code is unusable unoptimised; keep debug info but optimise deps.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Per-pixel loops (scaling, alignment, thumbnails, signals) run on every
# analysed frame; dev builds would otherwise analyse several times slower.
[profile.dev.package.as-vision]
opt-level = 3

[profile.dev.package.as-analysis]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

# tauri-specta only supports Tauri 2 upstream; this copy is ported to Tauri 3 (see vendor/tauri-specta/AUTOSCENE.md).
[patch.crates-io]
tauri-specta = { path = "vendor/tauri-specta" }
