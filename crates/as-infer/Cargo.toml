[package]
name = "as-infer"
description = "AutoScene inference runtime: loads the bundled ONNX Runtime and picks the GPU execution provider"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
# Names the folders compiled models are kept in (cache.rs).
sha2.workspace = true
# Reads accel.toml, the pins of NVIDIA's engine (accel.rs).
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
# One binary for every ONNX Runtime >= 1.24 (the DirectML build 1.24.4 on
# Windows, 1.31.1 on macOS and Linux), loaded from the app's own folder at
# runtime.
ort = { workspace = true, features = ["std", "load-dynamic", "api-24"] }
# Asks the loaded runtime its version, which ort keeps to itself (lib.rs).
libloading.workspace = true

[target.'cfg(windows)'.dependencies]
ort = { workspace = true, features = ["directml"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
# DXCore's interfaces only: dxcore.dll itself is loaded at run time (computer.rs).
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_DXCore"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { workspace = true, features = ["coreml"] }
libc.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
